# AtelIer の Setup.exe を組んで artifact に置く。Release は atelier-e2e が Windows で確かめてから出す。
# 公開のリポジトリなので Actions の枠を使わない。手元で組むと時間とディスクを食うため、組むのはここで行う。
# Linux の上で NSIS を使って組む（Windows のランナーは使わない）。1 回 約 5 分。
name: atelier-setup
on:
  push:
    paths:
      - "atelier/**"
      - "tools/**"
      - "styles/**"
      - "casts/**"
      - "config/**"
      - "packaging/**"
      - "VERSION"
      - ".github/workflows/atelier-setup.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: atelier-setup-${{ github.ref }}
  cancel-in-progress: true   # 続けて push したら古い方を止める
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis python3-pil  # python3-pil は build.sh が .ico の無いときにアイコンを作るのに使う
      - name: Setup.exe を組む
        run: sh packaging/build.sh
      # Release はここでは出さない。Windows で動くのを確かめた版だけを atelier-e2e の release が出す
      - name: 試す版として置く
        uses: actions/upload-artifact@v4
        with:
          name: AtelIer-Setup
          path: dist/*.exe
          retention-days: 7
