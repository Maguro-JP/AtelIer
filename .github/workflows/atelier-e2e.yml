# 組んだ Setup.exe を Windows の機械に入れ、起動・描く・保存と読み込み・アンインストールを本物の経路で通す（atelier/bench/end_to_end.py）。
# 手元の Linux や wine では、pythonw の出力の無さや ProgramData の権限など、Windows だけで起きる崩れを見つけられなかった。
# 致命的な不具合の直しを待たせないため、Release を決める段（windows）は最小にし、通ったらすぐ release を動かす。
# 重い段（精度優先、利用者の操作、検品の部品）は release のあとに windows-heavy で流し、落ちたら赤くして次の版で直す。
# 目安: main に入ってから Release まで 約 12 分（組む 約 3 分、入れる・起動・描く・保存・取る 約 6 分（キャッシュが効けば 約 3 分）、release 1 分）。
# 前は 約 50〜60 分（組む 3 分、入れる・取る 3〜10 分、描く・精度優先・利用者の操作の段 25 分まで、アンインストール、release）。
# Windows の機械を作業ブランチの回と取り合わないよう、Windows の段は main への push と手で起こしたときだけ流す。
name: atelier-e2e
on:
  push:
    paths:
      - "atelier/**"
      - "tools/**"
      - "packaging/**"
      - "VERSION"
      - ".github/workflows/atelier-e2e.yml"
  workflow_dispatch:
    inputs:
      gui_only:
        description: "画面で進める入れ方の確かめ（windows-gui）だけを流す"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # main の回は main だけの組にし、作業ブランチの回に待たされない。main は取り消さずに順に流す（Release を飛ばさない）。
  # 作業ブランチは Linux の段だけなので、続けて push したら古い回を止める
  group: atelier-e2e-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 部品
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 && pip install -q PySide6 numpy scipy scikit-image pillow
      - name: 綺麗にする加工の回帰試験
        env:
          QT_QPA_PLATFORM: offscreen
          ATELIER_CHECK: "off"
        run: |
          # Qt の QApplication を使うテスト群を別プロセスに分ける。
          # 1 プロセスにまとめると、テスト間の Qt オブジェクト破棄順で runner が segfault する。
          python -m unittest -v tests.test_finish_quality.CleanKeepsOriginalTest
          python -m unittest -v tests.test_shortcuts.GroupTest tests.test_shortcuts.MenuTest tests.test_shortcuts.ModelFreeTest
          python -m unittest -v tests.test_finish2.FinishMenuTest
          python -m unittest -v tests.test_omakase
          python -m unittest -v tests.test_origqc
          python -m unittest -v tests.test_phases
          python -m unittest -v tests.test_draw_api
  # tests/needs_models.txt のファイル（赤ペン・レイヤー・ショートカットなど）は torch が無い機械では丸ごと飛ばされ、
  # 上の回帰の段も決まったファイルしか流さないので、どこでも流れていなかった。CPU 版の torch と diffusers を入れて全部を流す。
  # Release を決める段（release の needs）には入れない。落ちたらこのジョブが赤くなる。
  needs-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-needs-models-${{ runner.os }}-${{ hashFiles('.github/workflows/atelier-e2e.yml') }}
          restore-keys: pip-needs-models-${{ runner.os }}-
      - name: 部品（CPU 版の torch と diffusers）
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libegl1
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate PySide6 numpy scipy scikit-image pillow
      - name: モデルの部品が要るファイル
        run: python scripts/run_tests.py $(grep -v '^#' tests/needs_models.txt)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis python3-pil  # build.sh が .ico の無いときにアイコンを作るのに使う
      - run: sh packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: dist/AtelIer-Setup.exe
          retention-days: 3
  # Release を決める最小の段。入れる・起動・窓が出る・1 枚描く・保存して開き直す・アンインストール
  windows:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.gui_only)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: setup
      - name: 入れる
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\AtelIer-Setup.exe -ArgumentList '/S' -Wait -PassThru
          "exit=$($p.ExitCode)"
          Get-ChildItem "C:\Program Files\AtelIer" | Select-Object Name
          if (-not (Test-Path "C:\Program Files\AtelIer\python\pythonw.exe")) { throw "入っていない" }
      # 描く部品（CPU 版の torch など、ProgramData）と模型（C:\LLM）を毎回取り直さない。取る段そのものは毎回通す
      - uses: actions/cache@v4
        with:
          path: |
            C:\LLM
            C:\ProgramData\AtelIer\gen\lib
          key: e2e-models-${{ runner.os }}-${{ hashFiles('atelier/models/**', 'atelier/qc/parts.py', 'packaging/**') }}
          restore-keys: e2e-models-${{ runner.os }}-
      - name: 起動・取得・描く・保存して開き直す
        timeout-minutes: 20
        shell: pwsh
        env:
          ATELIER_E2E_STAGE: release
        run: |
          & "C:\Program Files\AtelIer\python\python.exe" -E -s -m atelier.bench.end_to_end "$env:RUNNER_TEMP\e2e"
          $code = $LASTEXITCODE
          $report = "$env:RUNNER_TEMP\e2e\report.json"
          if (Test-Path $report) { Get-Content $report } else { Write-Error "E2E report.json was not created; Python exit code: $code" }
          if ($code -ne 0) { exit $code }
          if (-not (Test-Path $report)) { exit 1 }
        working-directory: C:\Program Files\AtelIer
      - name: アンインストールして残りを見る
        if: always()
        shell: pwsh
        run: |
          # 利用者の物を置いておき、アンインストールが入れた物だけを消して、これらを残すかを見る
          $mine = @("C:\Program Files\AtelIer\mine\note.txt",
                    "C:\ProgramData\AtelIer\extensions\sample\keep.txt",
                    "C:\ProgramData\AtelIer\library\keep.txt",
                    "C:\LLM\keep.txt")
          foreach ($f in $mine) { New-Item -ItemType File -Force -Path $f | Out-Null }
          $p = Start-Process -FilePath "C:\Program Files\AtelIer\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          # アンインストーラーは自分を一時の場所に写して動くので、終わるまで待つ
          for ($i = 0; $i -lt 60 -and (Test-Path "C:\Program Files\AtelIer\Uninstall.exe"); $i++) { Start-Sleep 2 }
          $lost = $mine | Where-Object { -not (Test-Path $_) }
          if ($lost) { throw "アンインストールが利用者の物を消した: $($lost -join ', ')" }
          $extra = Get-ChildItem -Force "C:\Program Files\AtelIer" | Where-Object { $_.Name -ne "mine" }
          if ($extra) { $extra | Select-Object FullName; throw "インストール先にアプリの物が残った" }
          foreach ($f in $mine) { Remove-Item -Force $f }
          Remove-Item -Recurse -Force "C:\Program Files\AtelIer", "C:\ProgramData\AtelIer\extensions\sample"
          # ユーザーのデータと設定（C:\ProgramData\AtelIer）は、更新や入れ直しで消さないため残す決まり
          $left = @("C:\Program Files\AtelIer",
                    "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\AtelIer",
                    "C:\Users\Public\Desktop\AtelIer.lnk") | Where-Object { Test-Path $_ }
          "残った物: $($left -join ', ')"
          if ($left) { Get-ChildItem -Recurse $left | Select-Object -First 30 FullName; throw "アンインストールで残った物がある" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
          retention-days: 7
  # 利用者と同じに Setup.exe をダブルクリックして画面で進める道（packaging/gui_install_check.ps1）。
  # windows の段は /S でしか入れておらず、コンポーネントのページ・終わりの「起動する」・動いているアプリの上書きを通していなかった。
  # fresh: 何も無い機械に入れ、起動したまま同じ Setup.exe を画面で入れ直す。upgrade: 前の Release を入れて起動した上から入れる
  windows-gui:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, upgrade]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
      - uses: actions/download-artifact@v4
        with:
          name: setup
      - name: 前の Release を入れて起動する
        if: matrix.scenario == 'upgrade'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*Setup*.exe' --output old-Setup.exe
          gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName
          $p = Start-Process -FilePath .\old-Setup.exe -ArgumentList '/S' -Wait -PassThru
          "exit=$($p.ExitCode) 版=$(Get-Content 'C:\Program Files\AtelIer\VERSION')"
          Start-Process explorer.exe 'C:\Users\Public\Desktop\AtelIer.lnk'
          Start-Sleep 15
          Get-Process pythonw -ErrorAction SilentlyContinue | Select-Object Id, Path
      - name: 画面で入れる
        shell: powershell
        run: .\packaging\gui_install_check.ps1 -Setup "$PWD\AtelIer-Setup.exe" -Out "$env:RUNNER_TEMP\gui\first"
      - name: 起動したまま、画面で入れ直す
        shell: powershell
        run: .\packaging\gui_install_check.ps1 -Setup "$PWD\AtelIer-Setup.exe" -Out "$env:RUNNER_TEMP\gui\again"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-${{ matrix.scenario }}
          path: ${{ runner.temp }}/gui
          retention-days: 7
  # Release は、Windows で入れる・起動・取得・描く・保存して開き直す・アンインストールが通った Setup.exe だけを出す。
  # 前は組んだだけで Release に置いていて、Windows で動かない版（v0.1.0）を出した
  release:
    needs: [regression, windows, windows-gui]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: setup
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          gh release view "$tag" >/dev/null 2>&1 && { echo "$tag は公開済み"; exit 0; }
          gh release create "$tag" dist/*.exe --target "$GITHUB_SHA" --title "AtelIer $tag" \
            --notes "Windows で入れる・起動・取得・描く・保存して開き直す・アンインストールを通した版です。アプリの「ヘルプ」の「更新を確かめる」から入れられます。"
  # Release のあとに流す重い段（検品の部品の取得、右クリック、工程に分けて描く、赤ペン、検品、精度優先）。
  # Release は止めないが、落ちたらこのジョブが赤くなり、落ちた段を Summary に出す（次の版で直す）
  windows-heavy:
    needs: [build, release]
    if: always() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.gui_only))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: setup
      - name: 入れる
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\AtelIer-Setup.exe -ArgumentList '/S' -Wait -PassThru
          "exit=$($p.ExitCode)"
          Get-ChildItem "C:\Program Files\AtelIer" | Select-Object Name
          if (-not (Test-Path "C:\Program Files\AtelIer\python\pythonw.exe")) { throw "入っていない" }
      # 描く部品（CPU 版の torch など、ProgramData）と模型（C:\LLM）を毎回取り直さない。取る段そのものは毎回通す
      - uses: actions/cache@v4
        with:
          path: |
            C:\LLM
            C:\ProgramData\AtelIer\gen\lib
          key: e2e-models-${{ runner.os }}-${{ hashFiles('atelier/models/**', 'atelier/qc/parts.py', 'packaging/**') }}
          restore-keys: e2e-models-${{ runner.os }}-
      - name: 重い段
        timeout-minutes: 40
        shell: pwsh
        env:
          ATELIER_E2E_STAGE: heavy
        run: |
          & "C:\Program Files\AtelIer\python\python.exe" -E -s -m atelier.bench.end_to_end "$env:RUNNER_TEMP\e2e-heavy"
          $code = $LASTEXITCODE
          $report = "$env:RUNNER_TEMP\e2e-heavy\report.json"
          if (Test-Path $report) { Get-Content $report } else { Write-Error "E2E report.json was not created; Python exit code: $code" }
          if ($code -ne 0) { exit $code }
          if (-not (Test-Path $report)) { exit 1 }
        working-directory: C:\Program Files\AtelIer
      - name: 落ちた段を出す
        if: always()
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\e2e-heavy\report.json"
          if (-not (Test-Path $f)) { "::error::重い段の report.json が無い（途中で落ちたか固まった）"; exit 1 }
          $r = Get-Content $f -Raw | ConvertFrom-Json
          foreach ($s in $r.steps | Where-Object { -not $_.ok }) {
            "::error::重い段が落ちた: $($s.name)"
            "- 落ちた: $($s.name)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      - name: アンインストールして残りを見る
        if: always()
        shell: pwsh
        run: |
          # 利用者の物を置いておき、アンインストールが入れた物だけを消して、これらを残すかを見る
          $mine = @("C:\Program Files\AtelIer\mine\note.txt",
                    "C:\ProgramData\AtelIer\extensions\sample\keep.txt",
                    "C:\ProgramData\AtelIer\library\keep.txt",
                    "C:\LLM\keep.txt")
          foreach ($f in $mine) { New-Item -ItemType File -Force -Path $f | Out-Null }
          $p = Start-Process -FilePath "C:\Program Files\AtelIer\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          # アンインストーラーは自分を一時の場所に写して動くので、終わるまで待つ
          for ($i = 0; $i -lt 60 -and (Test-Path "C:\Program Files\AtelIer\Uninstall.exe"); $i++) { Start-Sleep 2 }
          $lost = $mine | Where-Object { -not (Test-Path $_) }
          if ($lost) { throw "アンインストールが利用者の物を消した: $($lost -join ', ')" }
          $extra = Get-ChildItem -Force "C:\Program Files\AtelIer" | Where-Object { $_.Name -ne "mine" }
          if ($extra) { $extra | Select-Object FullName; throw "インストール先にアプリの物が残った" }
          foreach ($f in $mine) { Remove-Item -Force $f }
          Remove-Item -Recurse -Force "C:\Program Files\AtelIer", "C:\ProgramData\AtelIer\extensions\sample"
          # ユーザーのデータと設定（C:\ProgramData\AtelIer）は、更新や入れ直しで消さないため残す決まり
          $left = @("C:\Program Files\AtelIer",
                    "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\AtelIer",
                    "C:\Users\Public\Desktop\AtelIer.lnk") | Where-Object { Test-Path $_ }
          "残った物: $($left -join ', ')"
          if ($left) { Get-ChildItem -Recurse $left | Select-Object -First 30 FullName; throw "アンインストールで残った物がある" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-heavy
          path: ${{ runner.temp }}/e2e-heavy
          retention-days: 7
