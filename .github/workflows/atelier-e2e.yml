# 組んだ Setup.exe を Windows の機械に入れ、起動・初回の取得・描く・アンインストールを本物の経路で通す（atelier/bench/end_to_end.py）。
# 手元の Linux や wine では、pythonw の出力の無さや ProgramData の権限など、Windows だけで起きる崩れを見つけられなかった。
# リポジトリは公開しているので Actions の枠を使わない。1 回 約 20 分（Setup.exe を組む 約 5 分、取得と描く 約 10 分）。
name: atelier-e2e
on:
  push:
    paths:
      - "atelier/**"
      - "tools/**"
      - "packaging/**"
      - "VERSION"
      - ".github/workflows/atelier-e2e.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: atelier-e2e-${{ github.ref }}
  cancel-in-progress: false   # 1 回 約 20 分かかる。続けて push すると取り消され、Windows の確かめが 1 回も最後まで流れなかったので、取り消さずに順に流す（待つのは最新の 1 本だけ）
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 部品
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 && pip install -q PySide6 numpy scipy scikit-image pillow
      - name: 綺麗にする加工の回帰試験
        env:
          QT_QPA_PLATFORM: offscreen
          ATELIER_CHECK: "off"
        run: |
          # Qt の QApplication を使うテスト群を別プロセスに分ける。
          # 1 プロセスにまとめると、テスト間の Qt オブジェクト破棄順で runner が segfault する。
          python -m unittest -v tests.test_finish_quality.CleanKeepsOriginalTest
          python -m unittest -v tests.test_shortcuts.GroupTest tests.test_shortcuts.MenuTest tests.test_shortcuts.ModelFreeTest
          python -m unittest -v tests.test_finish2.FinishMenuTest
          python -m unittest -v tests.test_omakase
          python -m unittest -v tests.test_origqc
          python -m unittest -v tests.test_phases
          python -m unittest -v tests.test_draw_api
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis python3-pil  # build.sh がアイコンの .ico を作るのに使う
      - run: sh packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: dist/AtelIer-Setup.exe
          retention-days: 3
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 80   # 入れる 1 分、取る 10 分、描く 1 分、利用者の操作の段 25 分まで、アンインストール
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: setup
      # CharacterDesigner から移ってきた人の機械を作る。模型の置き場を別のフォルダーに向けた places.json と、
      # そこに置いた小さな模型（end_to_end.py の TINY）。AtelIer がこの模型を一覧に出して使えるかを end_to_end.py で見る
      - name: CharacterDesigner から移る人の置き場を作る
        shell: pwsh
        run: |
          $cd = "C:\ProgramData\CharacterDesigner"
          $models = "C:\CDModels"
          New-Item -ItemType Directory -Force $cd, "$models\huggingface" | Out-Null
          @{ model_dir = $models } | ConvertTo-Json | Set-Content -Encoding utf8 "$cd\places.json"
          python -m pip install -q huggingface_hub
          python -c "from huggingface_hub import snapshot_download as d; print(d('hf-internal-testing/tiny-stable-diffusion-xl-pipe', cache_dir=r'$models\huggingface', allow_patterns=['*.json', '*.txt', 'unet/*.bin', 'vae/*.bin', 'text_encoder*/*.bin'], ignore_patterns=['*.fp16.*']))"
          Get-Content "$cd\places.json"
      - name: 入れる
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\AtelIer-Setup.exe -ArgumentList '/S' -Wait -PassThru
          "exit=$($p.ExitCode)"
          Get-ChildItem "C:\Program Files\AtelIer" | Select-Object Name
          if (-not (Test-Path "C:\Program Files\AtelIer\python\pythonw.exe")) { throw "入っていない" }
      - name: 起動・取得・描く
        shell: pwsh
        timeout-minutes: 30
        env:
          ATELIER_E2E_CORE_ONLY: "1"   # Release を決める段だけ。利用者の操作の段は次の段で流す
        run: |
          & "C:\Program Files\AtelIer\python\python.exe" -E -s -m atelier.bench.end_to_end "$env:RUNNER_TEMP\e2e"
          $code = $LASTEXITCODE
          $report = "$env:RUNNER_TEMP\e2e\report.json"
          if (Test-Path $report) {
            Get-Content $report
          } else {
            Write-Error "E2E report.json was not created; Python exit code: $code"
          }
          if ($code -ne 0) { exit $code }
          if (-not (Test-Path $report)) { exit 1 }
        working-directory: C:\Program Files\AtelIer
      # 利用者が窓で踏む段（CharacterDesigner の模型の置き場、絵の置き方、赤ペン、検品、保存と読み込み、精度優先）。
      # 落ちても Release は止めない（結果は e2e の artifact の user/report.json で見て直す）。固まっても 25 分で切る
      - name: 利用者の操作の段
        shell: pwsh
        timeout-minutes: 25
        continue-on-error: true
        run: |
          & "C:\Program Files\AtelIer\python\python.exe" -E -s -m atelier.bench.end_to_end "$env:RUNNER_TEMP\e2e\user"
          Get-Content "$env:RUNNER_TEMP\e2e\user\report.json" -ErrorAction SilentlyContinue
        working-directory: C:\Program Files\AtelIer
      - name: 検品の部品が入ったか
        shell: pwsh
        run: |
          $r = Get-Content "$env:RUNNER_TEMP\e2e\report.json" -Raw | ConvertFrom-Json
          $s = $r.steps | Where-Object { $_.name -eq "検品の部品がそろう" }
          if (-not $s -or -not $s.ok) { throw "初回の取得で検品の部品が入っていない" }
          "検品の部品: $($s.detail.parts -join ', ')"
      - name: アンインストールして残りを見る
        if: always()
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "C:\Program Files\AtelIer\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          # アンインストーラーは自分を一時の場所に写して動くので、終わるまで待つ
          for ($i = 0; $i -lt 60 -and (Test-Path "C:\Program Files\AtelIer"); $i++) { Start-Sleep 2 }
          # ユーザーのデータと設定（C:\ProgramData\AtelIer）は、更新や入れ直しで消さないため残す決まり
          $left = @("C:\Program Files\AtelIer",
                    "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\AtelIer",
                    "C:\Users\Public\Desktop\AtelIer.lnk") | Where-Object { Test-Path $_ }
          "残った物: $($left -join ', ')"
          if ($left) { Get-ChildItem -Recurse $left | Select-Object -First 30 FullName; throw "アンインストールで残った物がある" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
          retention-days: 7
  # Release は、Windows で入れる・起動・取得・描く・アンインストールが全部通った Setup.exe だけを出す。
  # 前は組んだだけで Release に置いていて、Windows で動かない版（v0.1.0）を出した
  release:
    needs: [regression, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: setup
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          gh release view "$tag" >/dev/null 2>&1 && { echo "$tag は公開済み"; exit 0; }
          gh release create "$tag" dist/*.exe --target "$GITHUB_SHA" --title "AtelIer $tag" \
            --notes "Windows で入れる・起動・取得・描く・アンインストールを通した版です。アプリの「ヘルプ」の「更新を確かめる」から入れられます。"
