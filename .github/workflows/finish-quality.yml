# Focused image-finishing regression suite. Kept separate from the Windows installer E2E
# so numerical quality tests can finish quickly and report failures independently.
name: finish-quality
on:
  push:
    branches:
      - "fix/restore-safe-denoise-cleanup"
    paths:
      - "atelier/ai/finishers.py"
      - "tests/test_finish_quality.py"
      - "tests/test_shortcuts.py"
      - "tests/test_finish2.py"
      - "atelier/ai/omakase.py"
      - "tests/test_omakase.py"
      - "tools/finishing_preview.py"
      - "tools/gen/retouch.py"
      - ".github/workflows/finish-quality.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: finish-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 && pip install -q PySide6 numpy scipy scikit-image pillow
      - name: Image finishing regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          ATELIER_CHECK: "off"
        run: >-
          python -m unittest
          tests.test_finish_quality.CleanKeepsOriginalTest
          tests.test_shortcuts.GroupTest
          tests.test_shortcuts.MenuTest
          tests.test_shortcuts.ModelFreeTest
          tests.test_finish2.FinishMenuTest
          tests.test_omakase
      - name: Generate visual review images
        run: python tools/finishing_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: finishing-review
          path: artifacts/finishing-review/
          retention-days: 3
