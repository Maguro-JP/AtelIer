# 綺麗にする加工の段階ごとの秒と最大メモリを、前の版と今の版、部位分けの設定を並べて、同じ機械で測る（atelier/bench/finish_bench.py）。
# 手元の機械はほかの作業と共用で、秒が ±5 秒揺れて差を決められなかった。負荷の無い Actions の機械で並べて比べる。
name: finish-bench
on:
  workflow_dispatch:
    inputs:
      old:
        description: 前の版（コミット）
        default: "v0.1.0"
      only_upscale:
        description: 拡大だけを測る（1）
        default: "1"
  push:
    branches: ["claude/FIX-finish2-*"]
    paths:
      - "atelier/bench/finish_bench.py"
      - ".github/workflows/finish-bench.yml"
permissions:
  contents: read
concurrency:
  group: finish-bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATELIER_FETCH: "1"   # tools/gen/edit.py は既定で取りに行かない。部位分けの模型をこの機械で取る
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch && pip install -q numpy scipy scikit-image pillow transformers huggingface_hub
      - run: git worktree add ../old "${{ github.event.inputs.old || 'v0.1.0' }}"
      - run: lscpu | grep -E "Model name|^CPU\(s\)|Flags" | cut -c1-200
      - shell: bash   # pipefail を付ける（tee の後ろに置くと、台が落ちても緑になった）
        run: |
          for p in tests/fixtures/yukionna.png tests/fixtures/pockets.png; do
            echo "== $p"
            python -m atelier.bench.finish_bench "$p" --upscale
            [ "${{ github.event.inputs.only_upscale || '1' }}" = "1" ] || python -m atelier.bench.finish_bench "$p" "$(cd ../old && pwd)"
          done | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: finish-bench
          path: bench.txt
          retention-days: 7
