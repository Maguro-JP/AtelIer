[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier"
version = "0.1.0"
description = "人が使う、AI が使う、AI を使うペイントソフト"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
# 仕上げ（綺麗にする、清書、質感）が使う
finish = ["scipy", "scikit-image"]
dev = ["pyflakes", "scipy", "scikit-image"]

[project.gui-scripts]
atelier = "atelier.app.main_window:main"

[tool.setuptools.packages.find]
include = ["atelier*"]

[tool.setuptools.package-data]
atelier = ["assets/*.svg", "models/*.json", "ai/*.json", "ai/icon/*", "ui/help/*", "app/styleprev/*"]
